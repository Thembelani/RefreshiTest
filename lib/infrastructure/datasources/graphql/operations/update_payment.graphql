mutation UpdatePayment(
    $id: ID!
    $token: String!
    $deletedAt: String
    $fulfilled: Boolean
) {
    updatePayment(
        id: $id
        token: $token
        deletedAt: $deletedAt
        fulfilled: $fulfilled
    ) {
        id
        cartId
        token
        fulfilled
        createdAt
        updatedAt
        deletedAt
    }
}
